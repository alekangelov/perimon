[package]
name = "perimon"
version = "0.1.0"
edition = "2024"
authors = ["Alek"]
description = "Sleek native Windows peripheral battery monitor for gaming headsets, mice, keyboards, and Bluetooth devices"

[dependencies]
eframe = "0.37.0"
muda = "0.21.2"
notify-rust = "4.19.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tray-icon = "0.26.1"

[build-dependencies]
winres = "0.1.12"
